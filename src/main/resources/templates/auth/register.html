<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Quản lý công việc</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #0079BF; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #0079BF; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #333; font-weight: bold; }
        input { width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        input:focus { outline: none; border-color: #0079BF; }
        button { width: 100%; padding: 0.8rem; background: #5AAC44; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
        button:hover { background: #49902a; }
        .alert-error { background: #FFEBE6; color: #BF2600; padding: 0.8rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
        .link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        .link a { color: #0079BF; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>🔷 Tạo tài khoản</h1>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}">
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" th:field="*{fullName}" placeholder="Nhập họ tên..." required />
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Nhập email..." required />
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" th:field="*{password}" placeholder="Ít nhất 6 ký tự..." required />
        </div>
        <button type="submit">Tạo tài khoản</button>
    </form>

    <div class="link">
        Đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a>
    </div>
</div>
</body>
</html>
